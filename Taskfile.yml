version: "3"

vars:
  REGISTRY: ""
  LOCAL_REGISTRY: localhost/agent-deskbench
  IMAGE: "{{.LOCAL_REGISTRY}}/desktop:1"
  FIREFOX_IMAGE: "{{.LOCAL_REGISTRY}}/desktop-firefox:1"
  CHROMIUM_IMAGE: "{{.LOCAL_REGISTRY}}/desktop-chromium:1"

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  test:
    desc: Run the unit suite (container tests are skipped)
    cmds:
      - python3 -m unittest discover -s tests -v

  e2e:
    desc: Build the three images and run the container-backed suite against them
    deps: [image]
    cmds:
      - DESKBENCH_E2E=1 DESKBENCH_REGISTRY={{.LOCAL_REGISTRY}} python3 -m unittest discover -s tests -v

  lint:
    desc: Syntax check plus the branch-docs merge gate
    cmds:
      - python3 -m compileall -q deskbench tests
      - ./scripts/check-branch-docs.sh

  image:
    desc: Build the three built-in desktop images locally
    cmds:
      - podman build -t {{.IMAGE}} image
      - podman build --build-arg BASE={{.IMAGE}} -t {{.FIREFOX_IMAGE}} image/flavours/firefox
      - podman build --build-arg BASE={{.IMAGE}} -t {{.CHROMIUM_IMAGE}} image/flavours/chromium

  publish:
    desc: Build and push the three images (REGISTRY=..., VERSION=...)
    requires:
      vars: [VERSION]
    cmds:
      - ./scripts/publish-images.sh {{.REGISTRY | default "ghcr.io/nhermosilla14/agent-deskbench"}} {{.VERSION}}

  install-cli:
    desc: Install the deskbench command into ~/.local/bin (editable, via uv)
    cmds:
      - uv tool install --force --editable .
      - deskbench --version

  install-skill:
    desc: Install this project's skill for agents into ~/.agents/skills
    cmds:
      - mkdir -p ~/.agents/skills
      - rm -rf ~/.agents/skills/agent-deskbench
      - cp -a skill ~/.agents/skills/agent-deskbench
      - ls ~/.agents/skills/agent-deskbench

  new:
    desc: Start a desktop (example)
    cmds:
      - python3 -m deskbench new --name alpha

  autostart:
    desc: Install a desktop entry that starts the tray if desktops survive a reboot
    status:
      - test -f ~/.config/autostart/deskbench.desktop
    cmds:
      - mkdir -p ~/.config/autostart
      - cp contrib/deskbench.desktop ~/.config/autostart/

  clean:
    desc: Remove every desktop container and the three built-in images
    cmds:
      - podman ps -aq --filter label=deskbench=1 | xargs -r podman rm -f
      - podman rmi -i {{.IMAGE}} {{.FIREFOX_IMAGE}} {{.CHROMIUM_IMAGE}} || true

  check-docs:
    desc: Run the merge gate only
    cmds:
      - ./scripts/check-branch-docs.sh
