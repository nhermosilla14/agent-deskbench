[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-deskbench"
version = "1.0.0"
description = "Disposable graphical desktops for coding agents"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
deskbench = "deskbench.cli:main"

[tool.setuptools]
packages = ["deskbench"]
