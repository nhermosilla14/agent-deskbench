name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax
        run: python3 -m compileall -q deskbench tests

      - name: Branch records are finalized
        run: ./scripts/check-branch-docs.sh

      - name: Unit tests
        run: python3 -m unittest discover -s tests -v

# The container-backed tests need a container runtime and are skipped unless
# DESKBENCH_E2E=1 is set. Run `task e2e` locally before merging anything that
# touches the image, the tray or the runtime adapter.
